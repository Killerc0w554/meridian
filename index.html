<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A 24-hour appointment calendar with phone numbers built in. Click a time slot, add a caller, and call them from the schedule.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#04060a">
  <title>Project M — 24-hour appointment calendar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.5' fill='%2304060a'/%3E%3Cpath d='M6 17V7l6 7 6-7v10' fill='none' stroke='%235eead4' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="app-bar">
      <div class="brand">
        <svg class="brand-wordmark" role="img" aria-label="Project M" xmlns="http://www.w3.org/2000/svg" viewBox="0 -580 5743 720">
          <defs>
            <linearGradient id="wmInk" gradientUnits="userSpaceOnUse" x1="72" y1="0" x2="5760" y2="0">
              <stop offset="0" class="wm-ink-1" stop-color="#eafffb"/>
              <stop offset="0.44" class="wm-ink-2" stop-color="#f7fffd"/>
              <stop offset="1" class="wm-ink-3" stop-color="#5eead4"/>
            </linearGradient>
          </defs>
          <title>Project M</title>
          <text x="0" y="0" fill="url(#wmInk)" fill-opacity="1" font-family="'JetBrainsMono Nerd Font','JetBrains Mono',monospace" font-size="730" font-weight="400" letter-spacing="240">Project M</text>
        </svg>
      </div>

      <nav class="nav" aria-label="Calendar navigation">
        <button type="button" class="icon-btn" id="prevBtn" aria-label="Previous month">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
        </button>
        <h1 class="range" id="rangeLabel">Month</h1>
        <button type="button" class="icon-btn" id="nextBtn" aria-label="Next month">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
        </button>
        <button type="button" class="btn today-btn" id="todayBtn">Today</button>
      </nav>

      <div class="bar-spacer"></div>

      <div class="segmented" role="group" aria-label="Calendar view">
        <button type="button" data-view="day" aria-pressed="false">Day</button>
        <button type="button" data-view="week" aria-pressed="false">Week</button>
        <button type="button" data-view="month" aria-pressed="true">Month</button>
      </div>

      <div class="menu-wrap">
        <button type="button" class="icon-btn" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-label="More options">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></svg>
        </button>
        <div class="menu" id="menu" role="menu" aria-label="Calendar options" hidden>
          <div class="menu-label">Schedule</div>
          <button type="button" role="menuitem" data-action="new">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            New appointment <kbd>N</kbd>
          </button>
          <button type="button" role="menuitem" data-action="today">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2.5"></rect><path d="M16 3v4M8 3v4M3 10.5h18"></path></svg>
            Jump to today <kbd>T</kbd>
          </button>
          <div class="menu-sep" role="separator"></div>
          <div class="menu-label">Display</div>
          <button type="button" role="menuitemcheckbox" aria-checked="false" data-action="clock" id="clockItem">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
            <span>24-hour clock</span>
            <span class="switch" aria-hidden="true"><span class="switch-knob"></span></span>
          </button>
          <button type="button" role="menuitemcheckbox" aria-checked="false" data-action="theme" id="themeItem">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
            <span>Light mode</span>
            <span class="switch" aria-hidden="true"><span class="switch-knob"></span></span>
          </button>
          <button type="button" role="menuitem" data-action="print">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"></path><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            Print schedule
          </button>
          <div class="menu-sep" role="separator"></div>
          <div class="menu-label">Data</div>
          <button type="button" role="menuitem" data-action="export-json">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 10l5 5 5-5M12 15V3"></path></svg>
            Export backup (.json)
          </button>
          <button type="button" role="menuitem" data-action="export-ics">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"></rect><path d="M16 3v4M8 3v4M3 10.5h18M12 14v4M10 16h4"></path></svg>
            Export all to calendar (.ics)
          </button>
          <button type="button" role="menuitem" data-action="import">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 8l5-5 5 5M12 3v12"></path></svg>
            Import backup…
          </button>
          <button type="button" role="menuitem" data-action="clear" class="menu-danger">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path></svg>
            Clear all appointments
          </button>
        </div>
      </div>

      <div class="window-controls" data-no-drag>
        <button type="button" class="win-btn" id="winMinBtn" aria-label="Minimize window" title="Minimize">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 12.5h14"></path></svg>
        </button>
        <button type="button" class="win-btn" id="winMaxBtn" aria-label="Maximize window" title="Maximize">
          <svg class="icon win-icon-max" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="5.5" y="5.5" width="13" height="13" rx="2.2"></rect></svg>
          <svg class="icon win-icon-restore" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 8.5V7A1.5 1.5 0 0 1 10 5.5h7A1.5 1.5 0 0 1 18.5 7v7a1.5 1.5 0 0 1-1.5 1.5h-1.5"></path><rect x="5.5" y="8.5" width="10" height="10" rx="2"></rect></svg>
        </button>
        <button type="button" class="win-btn win-close" id="winCloseBtn" aria-label="Close window" title="Close">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path></svg>
        </button>
      </div>
    </header>

    <div class="subbar">
      <div class="nextup" id="nextUp" hidden>
        <span class="nextup-pulse" aria-hidden="true"></span>
        <button type="button" class="nextup-main" id="nextUpMain">
          <span class="nextup-when" id="nextUpWhen">Next</span>
          <span class="nextup-title" id="nextUpTitle"></span>
        </button>
        <span class="nextup-status" id="nextUpStatus" hidden></span>
        <a class="nextup-call" id="nextUpCall" href="#" hidden>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          Call
        </a>
      </div>

      <div class="bar-spacer"></div>

      <p class="hint">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 18h6M10 22h4"></path><path d="M12 2a7 7 0 0 0-4 12.7V18h8v-3.3A7 7 0 0 0 12 2z"></path></svg>
        Click a slot to schedule · drag to set the length
      </p>
    </div>

    <main class="calendar-main">
      <div class="cal-scroll" id="calScroll">
        <div class="cal-grid" id="calGrid" aria-label="Appointment calendar"></div>
      </div>
    </main>

    <div id="quickDock" class="quick-dock">
      <button type="button" class="quick-dock-bubble" id="quickDockBubble" aria-label="Toggle search" aria-controls="quickDockPanel" aria-expanded="false">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
      </button>
      <div class="quick-dock-panel" id="quickDockPanel">
        <button type="button" class="quick-dock-add" id="quickDockAdd" aria-label="Add new appointment">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
        <span class="quick-dock-dot" aria-hidden="true"></span>
        <div class="quick-dock-search">
          <svg class="icon search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
          <input type="search" id="dockSearch" placeholder="Search name, number, notes" aria-label="Search appointments" autocomplete="off" spellcheck="false">
        </div>
      </div>
    </div>
  </div>

  <dialog id="eventDialog" aria-labelledby="dialogTitle">
    <form class="dialog-card" id="eventForm" novalidate>
      <header class="dialog-head">
        <div>
          <h2 id="dialogTitle">New appointment</h2>
          <p class="dialog-sub">Times snap to 15 minutes.</p>
        </div>
        <button type="button" class="icon-btn" id="closeDialogBtn" aria-label="Close">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>
        </button>
      </header>

      <div class="dialog-body">
        <div class="field">
          <label for="evTitle">Candidate's name</label>
          <input id="evTitle" name="title" type="text" required maxlength="120" placeholder="e.g. Dana Whitfield" autocomplete="off">
        </div>

        <div class="field">
          <label for="evPhone">Phone number</label>
          <div class="input-group">
            <input id="evPhone" name="phone" type="tel" maxlength="60" placeholder="555-123-4567" autocomplete="tel" inputmode="tel">
            <a class="btn ghost call-link" id="modalCall" href="#" hidden>
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
              Call
            </a>
          </div>
        </div>

        <div class="field">
          <span class="field-label" id="evStatusLabel">Hiring status</span>
          <div class="status-toggle" id="statusToggle" role="group" aria-labelledby="evStatusLabel">
            <button type="button" data-status="hiring" aria-pressed="false">
              <span class="status-dot" aria-hidden="true"></span>
              Hiring
            </button>
            <button type="button" data-status="not-hiring" aria-pressed="false">
              <span class="status-dot" aria-hidden="true"></span>
              Not hiring
            </button>
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="evDate">Date</label>
            <input id="evDate" name="date" type="date" required>
          </div>
          <div class="field">
            <label for="evStart">Start</label>
            <input id="evStart" name="start" type="time" step="900" required>
          </div>
          <div class="field">
            <label for="evEnd">End</label>
            <input id="evEnd" name="end" type="time" step="900" required>
          </div>
        </div>

        <p class="duration-note" id="durationNote"></p>
        <p class="conflict" id="conflictNote" hidden>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M12 17h.01"></path><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
          <span id="conflictText"></span>
        </p>

        <div class="field">
          <label for="evNotes">Notes <span class="optional">optional</span></label>
          <textarea id="evNotes" name="notes" rows="3" maxlength="2000" placeholder="Agenda, context, anything useful before the call…"></textarea>
        </div>
      </div>

      <footer class="dialog-foot">
        <button type="button" class="btn danger" id="deleteBtn" hidden>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path></svg>
          Delete
        </button>
        <button type="button" class="btn ghost" id="icsBtn" hidden>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 10l5 5 5-5M12 15V3"></path></svg>
          Export .ics
        </button>
        <button type="button" class="btn ghost" id="addAnotherBtn" title="Save this appointment and start another at the same time">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          Save &amp; add another
        </button>
        <div class="foot-spacer"></div>
        <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn primary" id="saveBtn">Add appointment</button>
      </footer>
    </form>
  </dialog>

  <input type="file" id="importInput" accept="application/json,.json" hidden>

  <noscript>
    <p class="noscript">Project M needs JavaScript to run. Enable it and reload the page.</p>
  </noscript>

  <script src="app.js" defer></script>
</body>
</html>
